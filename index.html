<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#153f37"><title>AI Client Memory V2.3</title><style>body{font:16px system-ui;background:#f1f5f4;color:#18332e;margin:0}main{max-width:680px;margin:auto;padding:20px}section,article{background:white;padding:18px;border-radius:14px;margin:14px 0}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #b8c9c4;border-radius:8px;width:100%;margin:6px 0}button{background:#176b55;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block}img{max-width:100%;border-radius:8px}small{color:#53655f}#status{white-space:pre-wrap;color:#974321}input[type=checkbox]{width:auto} [hidden]{display:none!important}</style><main><h1>AI Client Memory</h1><small>V2.3 · Private single-barber test</small><p id="status" role="status"></p><section id="login"><h2>Barber login</h2><form id="loginForm"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required placeholder="Password"><button>Sign in</button></form><button id="signup">Create barber account</button></section><div id="app" hidden><button id="logout">Sign out</button><section><h2>Find customer</h2><input id="search" placeholder="Search name or preferences"><div id="results"></div></section><section><h2>New customer</h2><form id="customerForm"><input id="name" required maxlength="100" placeholder="First name and last initial"><textarea id="prefs" placeholder="Haircut preferences"></textarea><button>Add customer</button></form></section><section id="profile" hidden><h2 id="customerName"></h2><p id="customerPrefs"></p><h3>New visit</h3><form id="visitForm"><input id="service" required placeholder="Service (e.g. haircut)"><input id="price" required type="number" min="0" max="99999999" step="0.01" placeholder="Price charged ($)"><textarea id="notes" placeholder="Visit notes (use phone keyboard microphone to dictate)"></textarea><label>Optional haircut photo<input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><label><input id="consent" type="checkbox"> Customer agreed to store this photo</label><button>Save visit</button></form><h3>Visit history</h3><div id="history"></div></section></div></main><script type="module" src="app.js?v=2.3"></script><script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(console.warn);</script></html>
