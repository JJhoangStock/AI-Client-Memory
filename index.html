<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><meta name="theme-color" content="#153f37"><title>AI Client Memory V2.8</title><style>body{font:16px system-ui;background:#f1f5f4;color:#18332e;margin:0}main{max-width:680px;margin:auto;padding:20px}section,article{background:white;padding:18px;border-radius:14px;margin:14px 0}input,textarea,button{box-sizing:border-box;font:inherit;padding:12px;border:1px solid #b8c9c4;border-radius:8px;width:100%;margin:6px 0}button{background:#176b55;color:white;cursor:pointer}button:disabled{opacity:.5}label{display:block}img{max-width:100%;border-radius:8px}small{color:#53655f}#status{white-space:pre-wrap;color:#974321}input[type=checkbox]{width:auto}  .photoSlot{border:1px solid #b8c9c4;padding:10px;margin:8px 0;border-radius:8px}.photoSlot img{max-height:160px;object-fit:contain}.photoSlot button{background:#53655f}article img{cursor:zoom-in;max-height:240px;object-fit:contain;margin:4px} [hidden]{display:none!important}.big{padding:30px 12px;font-size:23px;font-weight:650;margin:10px 0}.big small{display:block;font-size:14px;font-weight:400;color:inherit;margin-top:8px}.secondary{background:white;color:#176b55;border:1px solid #176b55}select{box-sizing:border-box;font:inherit;width:100%;padding:12px;border:1px solid #b8c9c4;border-radius:8px;margin:6px 0;background:white;color:#18332e}.cuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.cut{font-size:14px;margin:0}.cut[aria-pressed=true]{background:#176b55;color:white}fieldset{border:1px solid #b8c9c4;border-radius:8px;padding:10px;min-width:0} #alphabet{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}#alphabet button{padding:8px 0;margin:0}#alphabet button[aria-pressed=true]{background:#176b55;color:white}#photoSlots,.savedPhotos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.photoSlot{min-width:0;padding:5px;text-align:center;margin:0}.photoSlot button{font-size:12px;padding:8px 2px}.photoSlot img,.savedPhotos img{width:100%;aspect-ratio:1;object-fit:cover;margin:0}.photoSlot label{font-size:13px}.photoSlot .placeholder{aspect-ratio:1;background:#edf2ef;display:grid;place-items:center;font-size:12px;border-radius:6px}.visitActions{display:flex;gap:6px}.visitActions button{font-size:14px} </style><main><h1>AI Client Memory</h1><small>V2.8 · Private single-barber test</small><p id="status" role="status"></p><section id="login"><h2>Barber login</h2><form id="loginForm"><input id="email" type="email" required placeholder="Email"><input id="password" type="password" required placeholder="Password"><button>Sign in</button></form><button id="signup">Create barber account</button></section><div id="app" hidden><section id="home"><button id="newCustomer" class="big">＋ New Customer<small>Add name, then haircut details</small></button><button id="existingCustomer" class="big secondary">Existing Customer<small>Search customer and view history</small></button><button id="logout" class="secondary">Sign out</button></section><section id="searchPanel" hidden><button id="searchBack" class="secondary">← Home</button><h2>Existing customer</h2><input id="search" placeholder="Search customer name" autocomplete="off"><div id="alphabet"></div><div id="results"></div></section><section id="identity" hidden><button id="identityBack" class="secondary">← Home</button><h2>New Customer</h2><form id="identityForm"><label>First name or nickname<input id="firstName" required maxlength="100" autocomplete="off"></label><label>Last name or initial (optional)<input id="lastName" maxlength="100" autocomplete="off"></label><button>Add Customer</button></form></section><section id="profile" hidden><button id="profileBack" class="secondary">← Back</button><h2 id="customerName"></h2><p id="customerPrefs"></p><form id="visitForm"><p>Optional haircut photos (up to 3)</p><di
